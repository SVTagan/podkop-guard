name: Observe-only watchdog tests

on:
  push:
    branches:
      - feature/watchdog-observe-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check shell syntax
        run: |
          set -eu
          sh -n podkop-guard
          sh -n tests/watchdog-check.sh
          sh -n tests/watchdog-monitor.sh
          sh -n tests/watchdog-init.sh
          sh -n tests/install-transaction.sh
          sh -n install.sh
          sh -n podkop-guard.init
          if command -v busybox >/dev/null 2>&1; then
            busybox sh -n podkop-guard
          fi
      - name: Run deterministic read-only scenarios
        run: |
          sh tests/watchdog-check.sh ./podkop-guard
          sh tests/watchdog-monitor.sh ./podkop-guard
          sh tests/watchdog-init.sh ./podkop-guard.init
          sh tests/install-transaction.sh ./install.sh
